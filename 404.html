<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Weiterleitung · Surhay Yilmaz</title>
  <script>
    // Leitet falsch geschriebene Adressen (z. B. /Kanban-Board, /kanban, /Rechnung) auf die richtige Seite.
    // GitHub-Pages-Pfade unterscheiden Groß-/Kleinschreibung – Handys schreiben oft den ersten Buchstaben groß.
    (function () {
      var routes = {
        'kanban-board': '/kanban-board/', 'kanbanboard': '/kanban-board/', 'kanban': '/kanban-board/', 'board': '/kanban-board/',
        'rechnungs-generator': '/rechnungs-generator/', 'rechnungsgenerator': '/rechnungs-generator/',
        'rechnung-generator': '/rechnungs-generator/', 'rechnungen': '/rechnungs-generator/', 'rechnung': '/rechnungs-generator/',
        'invoice': '/rechnungs-generator/', 'invoice-generator': '/rechnungs-generator/'
      };
      var parts = decodeURIComponent(location.pathname).toLowerCase().replace(/^\/+|\/+$/g, '').split('/');
      var first = parts[0].replace(/[\s_]+/g, '-');
      var target = routes[first] || routes[first.replace(/-/g, '')] || '/';
      if (routes[first] && parts.length > 1) {
        var rest = parts.slice(1).join('/');
        target += rest.indexOf('.') > -1 ? rest : '';
      }
      location.replace(target + location.search + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #F9FAFB; color: #101828; text-align: center; padding: 24px; }
    a { color: #7F56D9; font-weight: 600; }
    p { color: #475467; }
  </style>
</head>
<body>
  <main>
    <h1>Einen Moment …</h1>
    <p>Du wirst weitergeleitet. Falls nicht: <a href="/">zur Startseite</a></p>
    <p><a href="/kanban-board/">Kanban-Board</a> · <a href="/rechnungs-generator/">Rechnungsgenerator</a></p>
  </main>
</body>
</html>
